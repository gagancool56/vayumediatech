name: Fix Client Preview Rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix client preview rendering')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace blurry image previews with live previews
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          replacements = {
            'assets/clients/salim-caterers.png': 'https://salimcaterers.co.uk/',
            'assets/clients/inventevo-infotech.png': 'https://inventevoinfotech.in/'
          }
          for image, url in replacements.items():
            pattern = rf'<a class="client-preview-link" href="{re.escape(url)}"[^>]*>\s*<div class="client-preview">\s*<img src="{re.escape(image)}"[^>]*>\s*</div>\s*</a>'
            replacement = f'''<a class="client-preview-link" href="{url}" target="_blank" rel="noopener noreferrer"><div class="client-preview live-client-preview"><div class="browser-bar"><span></span><span></span><span></span><small>{url.replace('https://','')}</small></div><iframe src="{url}" title="Live preview of {url}" loading="lazy"></iframe></div></a>'''
            html, count = re.subn(pattern, replacement, html, count=1)
            if count == 0:
              raise SystemExit(f'Could not replace {image}')
          css = '''\n    .live-client-preview{height:420px;background:#fff;position:relative;overflow:hidden}\n    .browser-bar{height:34px;background:#eef1f5;border-bottom:1px solid #d7dce3;display:flex;align-items:center;gap:6px;padding:0 10px;color:#64748b}\n    .browser-bar span{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:block}\n    .browser-bar small{margin-left:8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n    .live-client-preview iframe{display:block;width:1600px;height:1000px;border:0;transform:scale(.385);transform-origin:top left}\n    @media(max-width:576px){.live-client-preview{height:300px}.live-client-preview iframe{transform:scale(.28)}}\n'''
          html = html.replace('</style>', css + '  </style>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-client-previews.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-client-previews.yml
          git commit -m "Fix client preview rendering"
          git push
