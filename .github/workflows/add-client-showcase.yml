name: Add Client Showcase
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-homepage:
    if: "!contains(github.event.head_commit.message, 'Add client showcase section')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add client showcase
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if 'id="client-showcase"' in html:
              raise SystemExit(0)
          marker = '  <!-- =========================================================\n       BLOG\n  ========================================================== -->'
          section = r'''  <!-- =========================================================
       CLIENT SHOWCASE
  ========================================================== -->
  <section id="client-showcase">
    <div class="container">
      <div class="text-center mb-5 reveal">
        <span class="tag mb-3"><i class="bi bi-briefcase"></i> Selected Work</span>
        <h2 class="section-title mt-2">Websites We’ve Built</h2>
        <p class="section-subtitle">
          Real websites developed by Vayu Media Tech for businesses across different industries.
        </p>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-md-6 reveal">
          <article class="glass-card p-4 h-100">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
              <div class="card-icon"><i class="bi bi-building"></i></div>
              <span class="tag">Business Website</span>
            </div>
            <h3 class="h4 fw-bold">Inventevo Infotech</h3>
            <p class="text-muted-custom">
              A professional business website for an IT and BPO solutions company, showcasing website and cloud solutions, SEO, digital marketing, lead generation and e-commerce services.
            </p>
            <div class="d-flex flex-wrap gap-2 mb-4">
              <span class="tag">Web Development</span>
              <span class="tag">Business Website</span>
              <span class="tag">SEO-ready</span>
            </div>
            <a href="https://inventevoinfotech.in/" target="_blank" rel="noopener noreferrer" class="btn btn-outline-glow rounded-pill px-4">
              Visit Website <i class="bi bi-box-arrow-up-right ms-1"></i>
            </a>
          </article>
        </div>

        <div class="col-md-6 reveal">
          <article class="glass-card p-4 h-100">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
              <div class="card-icon"><i class="bi bi-cup-hot"></i></div>
              <span class="tag">Catering Website</span>
            </div>
            <h3 class="h4 fw-bold">Salim Caterers</h3>
            <p class="text-muted-custom">
              A modern catering business website created to present services, menus and event catering offerings with a clear, customer-focused online experience.
            </p>
            <div class="d-flex flex-wrap gap-2 mb-4">
              <span class="tag">Web Development</span>
              <span class="tag">Hospitality</span>
              <span class="tag">Lead Generation</span>
            </div>
            <a href="https://salimcaterers.co.uk/" target="_blank" rel="noopener noreferrer" class="btn btn-outline-glow rounded-pill px-4">
              Visit Website <i class="bi bi-box-arrow-up-right ms-1"></i>
            </a>
          </article>
        </div>
      </div>

      <div class="text-center mt-5 reveal">
        <p class="text-muted-custom mb-3">Have a project in mind?</p>
        <a href="#contact" class="btn btn-ai rounded-pill px-4">Start Your Project <i class="bi bi-arrow-right ms-1"></i></a>
      </div>
    </div>
  </section>

'''
          if marker not in html:
              raise SystemExit('Blog marker not found')
          html = html.replace(marker, section + marker, 1)
          p.write_text(html, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-client-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-client-showcase.yml
          git commit -m "Add client showcase section"
          git push
