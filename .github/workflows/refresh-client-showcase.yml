name: Refresh Client Showcase
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: "github.event.head_commit.author.name != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture ultra-sharp client websites
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p assets/clients
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const pages = [
              ['https://salimcaterers.co.uk/','assets/clients/salim-caterers.png'],
              ['https://inventevoinfotech.in/','assets/clients/inventevo-infotech.png']
            ];
            for (const [url, out] of pages) {
              const context = await browser.newContext({
                viewport: { width: 1600, height: 1000 },
                deviceScaleFactor: 2,
                colorScheme: 'light'
              });
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.evaluate(async () => {
                if (document.fonts?.ready) await document.fonts.ready;
                for (const img of document.images) {
                  if (img.loading === 'lazy') img.loading = 'eager';
                  img.scrollIntoView({block:'center'});
                }
                window.scrollTo(0, 0);
              });
              await page.waitForTimeout(3000);
              await page.addStyleTag({content: `*, *::before, *::after { animation: none !important; transition: none !important; }`});
              await page.screenshot({ path: out, fullPage: false, type: 'png' });
              await context.close();
            }
            await browser.close();
          })();
          NODE
      - name: Update homepage showcase
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('assets/clients/salim-caterers.webp','assets/clients/salim-caterers.png')
          html=html.replace('assets/clients/inventevo-infotech.webp','assets/clients/inventevo-infotech.png')
          p.write_text(html,encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/refresh-client-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/clients .github/workflows/refresh-client-showcase.yml
          git commit -m "Capture sharper client showcase previews"
          git push
