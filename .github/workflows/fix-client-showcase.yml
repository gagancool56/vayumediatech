name: Fix Client Showcase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-showcase:
    if: "!contains(github.event.head_commit.message, 'Fix client showcase preview clarity')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve showcase presentation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          section = '''  <!-- =========================================================
       CLIENT SHOWCASE
  ========================================================== -->
  <section id="client-showcase">
    <div class="container">
      <div class="text-center mb-5 reveal">
        <span class="tag mb-3"><i class="bi bi-briefcase"></i> Selected Work</span>
        <h2 class="section-title mt-2">Websites We've Built</h2>
        <p class="section-subtitle">Real websites developed by Vayu Media Tech for businesses across different industries.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-6 reveal">
          <article class="glass-card h-100 overflow-hidden">
            <a href="https://salimcaterers.co.uk/" target="_blank" rel="noopener noreferrer" aria-label="Open Salim Caterers website" class="d-block p-2 text-decoration-none">
              <div class="client-preview-frame">
                <div class="client-browser-bar">
                  <span></span><span></span><span></span>
                  <small>salimcaterers.co.uk</small>
                </div>
                <div class="client-preview-image">
                  <img src="assets/clients/salim-caterers.png" alt="Salim Caterers website developed by Vayu Media Tech" loading="lazy" decoding="async" />
                </div>
              </div>
            </a>
            <div class="p-4">
              <div class="d-flex flex-wrap gap-2 mb-3">
                <span class="tag"><i class="bi bi-cup-hot"></i> Hospitality</span>
                <span class="tag"><i class="bi bi-geo-alt"></i> United Kingdom</span>
              </div>
              <h3 class="h4 fw-bold">Salim Caterers</h3>
              <p class="text-muted-custom">A premium catering website focused on authentic home-cooked food, events, menus, services, testimonials, FAQs, and customer enquiries across London.</p>
              <a href="https://salimcaterers.co.uk/" target="_blank" rel="noopener noreferrer" class="btn btn-outline-glow rounded-pill px-4">Visit Website <i class="bi bi-box-arrow-up-right ms-1"></i></a>
            </div>
          </article>
        </div>

        <div class="col-lg-6 reveal">
          <article class="glass-card h-100 overflow-hidden">
            <a href="https://inventevoinfotech.in/" target="_blank" rel="noopener noreferrer" aria-label="Open Inventevo Infotech website" class="d-block p-2 text-decoration-none">
              <div class="client-preview-frame">
                <div class="client-browser-bar">
                  <span></span><span></span><span></span>
                  <small>inventevoinfotech.in</small>
                </div>
                <div class="client-preview-image">
                  <img src="assets/clients/inventevo-infotech.png" alt="Inventevo Infotech website developed by Vayu Media Tech" loading="lazy" decoding="async" />
                </div>
              </div>
            </a>
            <div class="p-4">
              <div class="d-flex flex-wrap gap-2 mb-3">
                <span class="tag"><i class="bi bi-cpu"></i> IT & BPO</span>
                <span class="tag"><i class="bi bi-geo-alt"></i> India</span>
              </div>
              <h3 class="h4 fw-bold">Inventevo Infotech</h3>
              <p class="text-muted-custom">A business-focused website presenting IT, BPO, SEO, digital marketing, lead generation, Google Ads, and e-commerce services with a clear conversion-oriented structure.</p>
              <a href="https://inventevoinfotech.in/" target="_blank" rel="noopener noreferrer" class="btn btn-outline-glow rounded-pill px-4">Visit Website <i class="bi bi-box-arrow-up-right ms-1"></i></a>
            </div>
          </article>
        </div>
      </div>

      <div class="text-center mt-5 reveal">
        <p class="text-muted-custom mb-3">Have a project in mind?</p>
        <a href="#contact" class="btn btn-ai rounded-pill px-4">Start Your Project <i class="bi bi-arrow-right ms-1"></i></a>
      </div>
    </div>
  </section>

'''

          css = '''
    /* Client showcase preview: preserve screenshot detail and avoid forced cropping */
    .client-preview-frame{
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(0,0,0,0.22);
    }
    .client-browser-bar{
      height: 34px;
      padding: 0 12px;
      display:flex;
      align-items:center;
      gap:6px;
      background: #eef2f7;
      color: #536070;
      border-bottom: 1px solid #dce2ea;
    }
    .client-browser-bar span{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b7c0cc;
      flex: 0 0 auto;
    }
    .client-browser-bar small{
      margin-left: 8px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:.72rem;
    }
    .client-preview-image{
      width:100%;
      max-height:460px;
      overflow:hidden;
      background:#fff;
      line-height:0;
    }
    .client-preview-image img{
      width:100%;
      height:auto;
      min-height:0;
      display:block;
      object-fit:contain;
      object-position:top center;
      image-rendering:auto;
      transition:transform .25s ease;
    }
    .client-preview-frame:hover .client-preview-image img{
      transform:scale(1.015);
    }
    @media (max-width: 767.98px){
      .client-preview-image{max-height:330px;}
    }
'''

          marker = '    /* =========================================================\n       AI SECTION\n    ========================================================== */'
          if 'client-preview-frame{' not in html and marker in html:
              html = html.replace(marker, css + '\n' + marker, 1)

          pattern = r'  <!-- =========================================================\n       CLIENT SHOWCASE\n  ========================================================== -->.*?  </section>\n\n  <!-- =========================================================\n       BLOG'
          replacement = section + '  <!-- =========================================================\n       BLOG'
          new_html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Client showcase section not found')

          p.write_text(new_html, encoding='utf-8')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-client-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-client-showcase.yml
          git commit -m "Fix client showcase preview clarity"
          git push
